version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - 'test -n "$BREVO_API_KEY" || { echo "BREVO_API_KEY is missing from Amplify environment variables"; exit 1; }'
        - printenv BREVO_API_KEY | sed 's/^/BREVO_API_KEY=/' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
